name: Publish Fork Image

# the fork's own server image on ghcr.io, for the unraid container. no secrets needed,
# the workflow token can push packages to the repository owner's namespace.
# main publishes :main, development publishes :development (and the older :push), and
# :latest follows whichever branch built last, so a pull with no tag gets the newest build
on:
  push:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: fork-image-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build project artifacts
        uses: ./.github/actions/build-sharkord

      - name: Pick image tags
        id: tags
        run: |
          image=ghcr.io/${{ github.repository_owner }}/sharkord

          channel=${{ github.ref_name }}

          {
            echo 'list<<EOF'
            echo "$image:latest"
            echo "$image:$channel"
            echo "$image:$channel-${{ github.sha }}"
            if [ "$channel" = development ]; then echo "$image:push"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=Sharkord
            org.opencontainers.image.description=Sharkord Server (fork)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
