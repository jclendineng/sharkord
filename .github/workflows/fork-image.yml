name: Publish Fork Image

# the fork's own server image on ghcr.io, for the unraid container. no secrets needed,
# the workflow token can push packages to the repository owner's namespace
on:
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: fork-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build project artifacts
        uses: ./.github/actions/build-sharkord

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sharkord:latest
            ghcr.io/${{ github.repository_owner }}/sharkord:development
            ghcr.io/${{ github.repository_owner }}/sharkord:push
            ghcr.io/${{ github.repository_owner }}/sharkord:push-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Sharkord
            org.opencontainers.image.description=Sharkord Server (push fork)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
