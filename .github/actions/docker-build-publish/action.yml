name: Docker Build And Publish
description: Set up Docker build tooling, authenticate, and build/push multi-arch images.

inputs:
  docker_username:
    description: Docker Hub username
    required: true
  docker_password:
    description: Docker Hub password or token
    required: true
  tags:
    description: Docker image tags (newline separated)
    required: true
  labels:
    description: Docker image labels (newline separated)
    required: false
    default: ""
  context:
    description: Docker build context path
    required: false
    default: "."
  platforms:
    description: Target platforms
    required: false
    default: linux/amd64,linux/arm64
  qemu_platforms:
    description: Platforms to register with QEMU
    required: false
    default: arm64

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      with:
        platforms: ${{ inputs.qemu_platforms }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Log in to Docker Hub
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        username: ${{ inputs.docker_username }}
        password: ${{ inputs.docker_password }}

    - name: Build and push Docker image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: ${{ inputs.context }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
