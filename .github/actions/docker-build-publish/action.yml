name: Docker Build And Publish
description: Set up Docker build tooling, authenticate, and build/push multi-arch images.

inputs:
  docker_username:
    description: Docker Hub username
    required: true
  docker_password:
    description: Docker Hub password or token
    required: true
  tags:
    description: Docker image tags (newline separated)
    required: true
  labels:
    description: Docker image labels (newline separated)
    required: false
    default: ""
  context:
    description: Docker build context path
    required: false
    default: "."
  platforms:
    description: Target platforms
    required: false
    default: linux/amd64,linux/arm64
  qemu_platforms:
    description: Platforms to register with QEMU
    required: false
    default: arm64

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: ${{ inputs.qemu_platforms }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.docker_username }}
        password: ${{ inputs.docker_password }}

    - name: Build and push Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
