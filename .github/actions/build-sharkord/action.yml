name: Build Sharkord
description: Install Bun dependencies and build server artifacts. Requires checkout before use.

inputs:
  bun_version:
    description: Bun version to install
    required: false
    default: 1.3.14
  bump:
    description: Version bump mode (none, patch, minor, major)
    required: false
    default: none

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun_version }}

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Build app
      shell: bash
      run: |
        cd apps/server
        bun run build --bump "${{ inputs.bump }}"
